spring:
  datasource:  #数据库配置
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    url: jdbc:mysql://localhost:3306/mammalia

  mvc:
    view:
      prefix: classpath:/templates/
      suffix: .html

  thymeleaf:
    mode: HTML
    encoding: utf-8
    cache: false

mybatis:
  configuration:
    # 开启驼峰命名方式
    map-underscore-to-camel-case: true
# 开启 Mybatis 日志输出
logging:
  level:
    com.org.mammalia.mapper : TRACE
    root:

#server:
#  port: 8081

